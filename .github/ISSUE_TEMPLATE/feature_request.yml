name: Feature request
description: 提一个功能或改进
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        先说清楚「想解决什么问题」，比直接给方案更有用。设计文档在
        [docs/design/](../tree/main/docs/design)，先看看是不是已经有相关章节。
  - type: checkboxes
    id: searched
    attributes:
      label: 先确认
      options:
        - label: 我搜过现有 issue 与 docs/design，没有重复
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁在什么场景下遇到了什么麻烦？现在是怎么绕过去的？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么做
      description: 界面 / 接口 / 配置上的大致形态；有替代方案也写一下
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 涉及的部分
      multiple: true
      options:
        - 账号与权限
        - 用户 DSH 容器
        - 插件管理与下发
        - DSH 版本与运行时
        - 模型中转站与计费
        - 搜索与抓取池
        - 算力租赁
        - 桌面端
        - 手机端 / 语音
        - AI 助手（座舱）
        - 部署与运维
        - 文档
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充
      description: 截图、相关文档章节、愿意自己提 PR 的话也说一声
    validations:
      required: false

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSH Hub</title>
    <meta name="description" content="DSH Hub —— 多用户 DSH 托管平台" />
    <!--
      主题色与站点底色一致，移动端地址栏不会突兀。
      favicon 三份都在 public/（由 `node scripts/gen-brand-assets.mjs` 从品牌定稿素材铺出来）：
        favicon.ico            16/32/48 多尺寸，老浏览器与任务栏用它；
        favicon.svg            矢量加粗版（自带夜空底板），高分屏标签页用它；
        apple-touch-icon.png   180×180，iOS 添加到主屏用它（iOS 自己套 squircle 掩模，必须不透明）。
      以前这里是内联 SVG + DeepSeek 鲸鱼路径，开源版不再带任何官方图形。
    -->
    <meta name="theme-color" content="#F5F8FF" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif">
        DSH Hub 需要 JavaScript 才能使用，请在浏览器设置里打开 JavaScript 后刷新页面。
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

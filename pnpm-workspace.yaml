packages:
  - 'apps/*'
  - 'packages/*'
  # WP56b：座舱 DSH 的插件（随 Hub 版本发布，只装在座舱容器里；单测用 node --test）
  - 'runtime/plugins/*'
  # WP8a：端到端测试（真 Docker + 构建产物 + 真浏览器），不参与 pnpm -r test
  - 'e2e'

# pnpm 10 默认不执行依赖的构建脚本；这里只放行确实需要的（esbuild 校验平台二进制、vue-demi 生成入口）
onlyBuiltDependencies:
  - esbuild
  - vue-demi

# unocss 的 dist/vite.d.mts 直接 import "vite"，却没把 vite 声明成依赖；仓库里同时有 vite 7（apps/web）
# 和 vite 8（packages/mobile-ui），不补 peer 时它会落到 pnpm 隐藏提升的那份上，CI 里拿到 vite 8 导致类型不兼容
packageExtensions:
  unocss:
    peerDependencies:
      vite: '*'

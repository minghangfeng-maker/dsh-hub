# dshhub-ops —— 座舱 DSH 的管理插件（Hub 随版本发布，只装在座舱容器里）
#
# Hub 在启动座舱容器前把本包同步进容器内用户目录，再用
# `dsh plugin --profile web add file:/home/dsh/ops-plugin` 装进 profile；
# 安装器读 package.json 的 `dsh.bundle.patch` 把这个文件里的 loader 行插进 profile。
#
# **令牌不写在这里**：`DSHHUB_OPS_URL` / `DSHHUB_OPS_TOKEN` 由 Hub 建容器时注入环境变量，
# 每次启动座舱容器都重新生成，旧令牌立即作废（docs/24 §5）。
- insert:
    - id: dshhub-ops
      name: '@dshhub/ops'
      config:
        # 地址缺省取容器 env DSHHUB_OPS_URL（Hub 注入 http://10.213.0.1:7710/ops）。
        # 只有手工排查时才在本地 profile 里覆盖它，且不要在这里写 token。
        # url: http://10.213.0.1:7710/ops

        # 单次 /ops 请求超时（毫秒）
        timeoutMs: 20000

        # /ops/context 缓存（毫秒）：一个回合里多步不重复打 Hub
        contextTtlMs: 30000

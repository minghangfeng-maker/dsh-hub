# gitleaks 配置（密钥扫描白名单）
#
# 原则：**只**把已经逐条核实过「不是真密钥」的路径/规则列进来，每条都写清楚为什么。
# 往这里加东西之前先问一句：这个文件里以后会不会真的出现生产密钥？会的话不要按路径
# 放行，改成按行正则、或者把那行伪造值改掉。
#
# 扫描方式（与 CI / 验收一致）：
#   git archive HEAD | tar -x -C /tmp/scan && (cd /tmp/scan && gitleaks dir . --redact)
#
# 当前白名单覆盖 23 条命中，全部是测试夹具或常量：
#   插件包密钥扫描的输入夹具（必须长得像真密钥才测得出来）、座舱能力/盾牌测试里的假值、
#   后端单元测试的假 apiKey/token、前端 mock 数据、e2e 脚本里的假 key，以及一个密码字符集常量。
# 明细见 reports/T1b-app.md 的「密钥扫描」一节。

title = "DSH Hub"

[extend]
useDefault = true

# ── 1. 插件包「密钥扫描」功能的输入夹具 ────────────────────────────────────
# 这两个测试就是在测「能不能从插件包里扫出密钥」，夹具必须是 sk-/ghp_/AKIA/私钥/JWT 的形状，
# 全是编的（`sk-live-9f3a…`、`AbCdEf0123456789…`、eyJhbGci… 里的 payload 是 "1234567890"）。
[[allowlists]]
description = "插件包密钥扫描的输入夹具（假密钥，必须长得像真的）"
paths = [
  '''apps/api/test/plugins\.scan-tar\.test\.ts''',
  '''apps/api/test/plugins\.api\.test\.ts''',
]
rules = ['generic-api-key', 'jwt']

# ── 2. 座舱能力 / 盾牌：敏感值脱敏与回显的测试 ─────────────────────────────
# 断言的是「这些值不会出现在响应/日志里」，值本身是固定假串（sk-live-4f9a…、dshm_at_7Qm3…）。
[[allowlists]]
description = "座舱能力与盾牌测试里的假密钥 / 假令牌（测脱敏用）"
paths = [
  '''apps/api/test/cockpit\.secrets\.test\.ts''',
  '''apps/api/test/cockpit\.shield\.test\.ts''',
]
rules = ['generic-api-key']

# ── 3. 其它后端单元测试里的假 apiKey / token ───────────────────────────────
# - models.api.test.ts：`sk-test-key-…` / `sk-deepseek-…`（假渠道 key）
# - desktop.wp25e / instances.routes / plugins.api：假 apiKey、假 token
# - ws-upgrade.test.ts / wp52.edge-listener.test.ts：WebSocket 规范里的示例握手值
#   `Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==`（RFC 6455 §1.3 的 "the sample nonce"）
[[allowlists]]
description = "后端单元测试里的假 apiKey / token / 规范示例值"
paths = [
  '''apps/api/test/desktop\.wp25e\.test\.ts''',
  '''apps/api/test/instances\.routes\.test\.ts''',
  '''apps/api/test/models\.api\.test\.ts''',
  '''apps/api/test/wp52\.edge\-listener\.test\.ts''',
  '''apps/api/src/lib/ws\-upgrade\.test\.ts''',
]
rules = ['generic-api-key']

# ── 4. 前端 mock 与 e2e 脚本里的假值 ───────────────────────────────────────
# - apps/web/src/mocks/admin.ts：mock 数据里的「重置后的临时密码」
# - e2e/tests/J11-cockpit.ts：`FAKE_KEY = 'sk-j11-…'`（座舱评测夹具）
# - e2e/tools/runtime-build-regression.mjs：跑真容器用的**测试账号**口令（不是任何环境的口令）
# - scripts/e2e-cockpit-embed.mjs：`leakKey = 'sk-e2e-…'`（测「不该泄露的值不会泄露」）
[[allowlists]]
description = "前端 mock 数据与 e2e 脚本里的假密钥 / 测试账号口令"
paths = [
  '''apps/web/src/mocks/admin\.ts''',
  '''e2e/tests/J11\-cockpit\.ts''',
  '''e2e/tools/runtime\-build\-regression\.mjs''',
  '''scripts/e2e\-cockpit\-embed\.mjs''',
]
rules = ['generic-api-key']

# ── 5. 常量：临时密码字符集（不是密钥）─────────────────────────────────────
# `TEMP_PASSWORD_ALPHABET` 是「随机临时密码由这些字符组成」的字符表，通用 api-key 规则
# 把这一长串字母数字当成了密钥。按「路径 + 行内容」双重限定，避免掩盖这个文件里以后
# 真的出现的密钥。
[[allowlists]]
description = "临时密码字符集常量（TEMP_PASSWORD_ALPHABET，不是密钥）"
paths = ['''apps/api/src/lib/ids\.ts''']
regexTarget = "line"
regexes = ['''(?i)TEMP_PASSWORD_ALPHABET\s*=''']
rules = ['generic-api-key']
condition = "AND"
